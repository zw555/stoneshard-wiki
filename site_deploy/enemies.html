    d.innerHTML = `<img loading="lazy" src="icons/${e.ic}" onerror="this.style.visibility='hidden'">
      <div><div class="nm">${esc(e.zh) || esc(e.en)}<span class="en">${esc(e.en)}</span></div>
      <span class="tag">${esc(e.fa)}</span><span class="tag">${RANK[e.rk]||""}</span>
      <div class="st">${statLine(e)}</div></div>`;
    frag.appendChild(d);
  }
  grid.replaceChildren(frag);
  count.textContent = `显示 ${n} / ${DATA.length} 个敌人`;
}
q.oninput = render;
render();
</script>
</body>
</html>
